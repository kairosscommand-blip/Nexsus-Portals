name: NexusPortals
version: ${project.version}
main: com.nexuscraft.nexusportals.NexusPortalsPlugin
api-version: '1.21'
author: RealSociety
description: "A massive overhaul of portals. Real, deliberate linking -- every portal you light becomes its own named, cataloged entry, never vanilla's blind 8:1 coordinate math. A real, browsable destination menu -- step into a lit portal and choose where you're actually going from every portal you've discovered. Real upkeep -- a real, decaying stability stat only real fuel holds back, and a real reignite ritual a fully collapsed portal actually needs. And a real stronghold aid -- every eye-of-ender throw is tracked and triangulated into a growing-confidence estimate."

commands:
  nexusportals:
    description: Manage NexusPortals -- list/rename your discovered portals, check your stronghold estimate, or reload config.
    usage: /nexusportals <list|rename|stronghold|reload>
    aliases: [portals, nexportals, portal]
    permission: nexusportals.use
    permission-message: "§cYou don't have permission to do that."

permissions:
  nexusportals.admin:
    description: Reload NexusPortals's config.
    default: op
  nexusportals.use:
    description: List/rename your discovered portals and check your stronghold estimate.
    default: true
