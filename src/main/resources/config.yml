# NexusPortals -- a massive overhaul of portals.
#
# Every portal is still a real vanilla obsidian frame, still lit with real flint and steel -- this
# plugin only changes what happens once it's lit. Fixed shapes (the five stability tiers, the
# reignite ritual's own two-ingredient requirement, the triangulation math) stay in code; the
# shared numbers below are here, same "shared numbers in config, fixed shapes in code" split this
# whole family already uses.

enabled: true

decay:
  # How often (real minutes) every registered, non-dormant portal loses stability.
  interval-minutes: 30
  # How much stability is lost per interval.
  amount-per-interval: 4.0

fuel:
  # Real item a player right-clicks a portal's own obsidian frame with to restore stability.
  item: GLOWSTONE_DUST
  # Stability restored per real item consumed.
  restore-per-item: 8.0
  # Most real items a single right-click interaction will ever consume at once (never overfeeds
  # past what's actually needed to reach 100, either).
  max-items-per-interaction: 8

reignite:
  # A fully dormant (collapsed) portal needs BOTH of these, held in hand, at the moment it's
  # re-lit with flint and steel, to come back with its name/history intact rather than as a wild,
  # unlinked relight.
  catalyst-one: BLAZE_POWDER
  catalyst-one-amount: 1
  catalyst-two: ENDER_PEARL
  catalyst-two-amount: 1
  # Stability a successful reignite ritual restores to -- deliberately not a full 100, so a
  # reignited portal still needs some real, ordinary fuel upkeep afterward.
  restored-stability: 55.0

transit:
  # Chance of a rough, disorienting crossing (real minor damage + nausea) when stepping through a
  # portal at each of these two riskier tiers. STABLE/WEATHERED never roll for this at all.
  rough-transit-chance-unstable: 0.20
  rough-transit-chance-collapsing: 0.45
  rough-transit-damage: 2.0

naming:
  # Prefix for a portal's auto-generated name (both a brand-new portal and a "wild" relight of a
  # dormant one that skipped the reignite ritual get one of these until renamed).
  auto-name-prefix: "Portal"

menu:
  title: "Portal Network"

stronghold:
  # Fewest real eye-of-ender throws recorded before /nexusportals stronghold reports anything at
  # all (1 is enough for a real, low-confidence answer -- see StrongholdTriangulator's own notes).
  min-sightings-for-estimate: 1
